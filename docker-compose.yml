services:
  db:
    image: postgres:15
    container_name: taskdb
    environment:
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: tasks
    ports:
      - "5432:5432"
    volumes:
      - taskdata:/var/lib/postgresql/data
    restart: unless-stopped

  api:
    build: .
    container_name: taskapi
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:dev@db:5432/tasks
    depends_on:
      - db
    restart: unless-stopped

volumes:
  taskdata: